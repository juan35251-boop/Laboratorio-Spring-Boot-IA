# Application Name
spring.application.name=bank-transfer-service

# Active profile: 'dev' uses embedded H2 with pre-seeded bank accounts for instant execution.
# Switch to 'postgres' to use the PostgreSQL server as specified in the lab guide.
spring.profiles.active=dev

# Server Port
server.port=8080

# SpringDoc / Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
