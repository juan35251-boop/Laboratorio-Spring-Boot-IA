# ==============================================================================
# Development / Local H2 Database Configuration (File-based persistence)
# Saves data permanently to disk in ./data/bank_transfer_db so it is NOT lost on restarts
# ==============================================================================
spring.datasource.url=jdbc:h2:file:./data/bank_transfer_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Configuration (available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
